<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store | FLARONMC</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .store {
            padding: 60px 30px;
            max-width: 1200px;
            margin: auto;
        }

        .store-title {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }

        .store-subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 45px;
            font-size: 18px;
        }

        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .rank-card {
            background: #0f1f17;
            border: 1px solid #1e3a28;
            border-radius: 18px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,.3);
            transition: .3s;
        }

        .rank-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 0 30px rgba(140,255,105,.15);
        }

        .rank-card img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .rank-card h2 {
            color: #8cff69;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .buy-btn {
            display: inline-block;
            padding: 13px 28px;
            border-radius: 12px;
            background: #8cff69;
            color: black;
            text-decoration: none;
            font-weight: bold;
            transition: .3s;
        }

        .buy-btn:hover {
            background: #a5ff8c;
            transform: scale(1.05);
        }

        @media(max-width:700px) {
            .store-title {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="brand">
        <img src="logo.png" alt="FLARONMC">
        <h2>FLARONMC</h2>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="store.html">Store</a>
    </nav>
</header>

    <img src="logo.png" alt="FLARONMC Logo" class="store-logo">

<section class="store">

    <h1 class="store-title">FLARONMC Store</h1>
    <p class="store-subtitle">
        Choose your rank and support the server!
    </p>

    <div class="store-grid">

        <!-- FLARON -->
        <div class="rank-card">
            <img src="24135-removebg-preview_2.png" alt="FLARON">
            <h2>FLARON</h2>
            <div class="price">$9.99</div>
            <a class="buy-btn"
               href="https://discord.gg/5bjtzsGy2"
               target="_blank">
                Buy Now
            </a>
        </div>

        <!-- Prince -->
        <div class="rank-card">
            <img src="file_00000000324881f4a665612c5bbc4cdd.png" alt="Prince">
            <h2>Prince</h2>
            <div class="price">$8.99</div>
            <a class="buy-btn"
               href="https://discord.gg/5bjtzsGy2"
               target="_blank">
                Buy Now
            </a>
        </div>

        <!-- King -->
        <div class="rank-card">
            <img src="24130-removebg-preview.png" alt="King">
            <h2>King</h2>
            <div class="price">$4.99</div>
            <a class="buy-btn"
               href="https://discord.gg/5bjtzsGy2"
               target="_blank">
                Buy Now
            </a>
        </div>

        <!-- VIP -->
        <div class="rank-card">
            <img src="24140-removebg-preview.png" alt="VIP">
            <h2>VIP</h2>
            <div class="price">$2.99</div>
            <a class="buy-btn"
               href="https://discord.gg/5bjtzsGy2"
               target="_blank">
                Buy Now
            </a>
        </div>

    </div>
</section>

<footer>
    © 2026 FLARONMC. All rights reserved.
</footer>

</body>
</html>
