<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLARONMC Network</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>

<section class="hero">
<img src="logo.png" class="logo" alt="FLARONMC Logo">
<h1>FLARONMC NETWORK</h1>
<p class="ip">95.156.225.24:26178</p>

<div class="stats">
<div class="box">
<h2 id="players">Loading...</h2>
<p>Online Players</p>
</div>
<div class="box">
<h2 id="status">Checking...</h2>
<p>Server Status</p>
</div>
</div>

<a class="discord" href="https://discord.gg/mZcaNwU9by">JOIN DISCORD</a>
</section>

<script>
async function updateServer(){
 try{
   const r=await fetch('https://api.mcsrvstat.us/3/95.156.225.24:26178');
   const data=await r.json();
   document.getElementById('players').innerText=data.players?data.players.online:'0';
   document.getElementById('status').innerText=data.online?'ONLINE':'OFFLINE';
 }catch(e){
   document.getElementById('status').innerText='ERROR';
 }
}
updateServer();
setInterval(updateServer,30000);
</script>
</body>
</html>
